name: Automated CI/CD Deployment Pipeline

on:
  push:
    branches:
      - main
      - demo

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Docker Buildx runner
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Authenticate with Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 4: Build and Push Docker image to Docker Hub
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: vrundzzz/automated-cicd-portfolio:latest

      # Step 5: SSH into AWS EC2 & Deploy Container
      - name: Deploy to AWS EC2 Instance via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Checking if Docker is installed on EC2..."
            if ! command -v docker &> /dev/null; then
              echo "Docker not found on EC2. Installing Docker automatically..."
              sudo apt-get update -y
              sudo apt-get install -y docker.io
              sudo systemctl enable --now docker
            fi

            echo "Pulling latest Docker image from Docker Hub..."
            sudo docker pull vrundzzz/automated-cicd-portfolio:latest

            echo "Stopping existing portfolio container if running..."
            sudo docker stop portfolio || true

            echo "Removing existing portfolio container..."
            sudo docker rm portfolio || true

            echo "Starting new portfolio container on port 80..."
            sudo docker run -d -p 80:80 --name portfolio vrundzzz/automated-cicd-portfolio:latest

            echo "Deployment completed successfully!"
            sudo docker ps -f name=portfolio